<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pagina web de videojuegos" />
    <link rel="stylesheet" href="estilos.css" />
    <title>GameZone</title>
  </head>
  <body>
    <header class="cabecera">
      <!-- Logo/Marca de la página -->
      <div class="brand">
        <img
          class="logo"
          src="../../imagenes/gamezone-logo.png"
          alt="Logo de GameZone"
        />
        <!-- <h1 class="titulo">GameZone</h1> -->
      </div>

      <!-- Menu de Navegacion -->
      <nav class="navegacion">
        <ul class="menu">
          <li><a href="../../index.html">Inicio</a></li>
          <li><a href="#">Noticias</a></li>
          <li><a href="#">Guías</a></li>
          <li><a href="contacto.html" class="activo">Contacto</a></li>
          <li><a href="../formulario/formulario.html">Registro</a></li>
          <li><a href="../tienda/tienda.html">Tienda</a></li>
          <li><a href="../juegos/juegos.html">Juegos</a></li>
        </ul>
      </nav>
    </header>
    <main class="contenido-principal">
      <!-- Formulario de contacto -->
      <section class="tarjeta">
        <form
          class="contacto"
          name="contacto"
          action="contacto.php"
          method="get"
          autocomplete="off"
        >
          <fieldset>
            <legend><b>Contacto</b></legend>
            <!-- Lista desplegable -->
            <div class="form-row">
              <label for="categoria">Categoría de juego:</label>
              <select name="categoria" id="categoria">
                <option disabled selected>-Selecciona categoría-</option>
                <option value="rol">Rol</option>
                <option value="aventura">Aventura</option>
                <option value="deportes">Deportes</option>
              </select>
            </div>

            <!-- Radio y checkbox -->

            <div class="form-row">
              <p>Plataforma:</p>
              <label>
                <input type="radio" name="plataforma" value="pc" />PC
              </label>
            </div>
            <div class="form-row">
              <label>
                <input type="radio" name="plataforma" value="ps" />PS5
              </label>
            </div>
            <div class="form-row">
              <p>Subscribirse a noticias</p>
              <label><input type="checkbox" name="subscripcion" />Sí</label>
            </div>

            <!-- Hidden se utiliza para enviar datos no visibles para el usuario -->
            <input type="hidden" name="product id" value="1234" />

            <!-- Textarea: textos largos -->
            <br />
            <div class="form-row">
              <label for="mensaje">Deja aquí tu mensaje:</label>
              <textarea
                name="mensaje"
                id="mensaje"
                cols="30"
                rows="10"
              ></textarea>
            </div>

            <!-- Botones -->
            <div class="form-row">
              <button type="submit">Contactar</button>
            </div>
            <div class="form-row">
              <button type="reset">Limpiar formulario</button>
            </div>
          </fieldset>
        </form>
      </section>
      <section class="contacto-ubicacion tarjeta">
        <h2>Donde estamos</h2>
        <p>
          Nos encontramos en tu centro educativo más odiado. ¡Vete al carajo!
        </p>
        <!-- Caja contenedora del mapa -->
        <div class="mapa-contenedor">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3197.250350392246!2d-4.5570377243231475!3d36.740561471059344!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd72f10963ce0f3d%3A0x310ae7d4bb2e8f7b!2sCPIFP%20Alan%20Turing!5e0!3m2!1ses!2ses!4v1764587557301!5m2!1ses!2ses"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </section>
    </main>
    <footer class="pie">
      <p>&copy; 2025 Todos los derechos reservados</p>
    </footer>
  </body>
</html>
